name: A股市场全景仪表盘

on:
  schedule:
    # 北京时间 16:00 (UTC 08:00), 周一至周五
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '跳过非交易日检查，强制运行'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行全景仪表盘
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: |
          python market_dashboard.py ${{ inputs.force && '--force' || '' }}
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::全景仪表盘运行失败或存在告警（exit $code），请查看日志"
          fi
          # F2: 失败已留痕，仍 exit 0 以执行后续留痕提交
          exit 0

      - name: 信号留痕提交
        # F4: trade_log.jsonl 随 workflow 持久化，供次日 detect_signal_flips 对比信号翻转
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_log.jsonl || true
          git diff --cached --quiet || git commit -m "data: 仪表盘信号留痕 [skip ci]"
          git push

