name: 每日资金观察

on:
  # schedule 已停用（Task 6：合并系统上线后单卡单推，资金观察内容并入 rally-health 16:15 卡片）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 每日资金观察
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python ltc_main.py
          code=$?
          echo "ltc_main exit: $code"
          if [ "$code" -ne 0 ]; then echo "::error::ltc_main exit=$code (连续降级或发送失败，见运行日志)"; fi
          exit 0
      - name: 提交留痕
        run: |
          mkdir -p data/ltc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ltc || true
          git diff --cached --quiet || git commit -m "data: 每日资金观察留痕 [skip ci]"
          git push
