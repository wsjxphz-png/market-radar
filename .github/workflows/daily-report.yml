name: 美股状态日报

# 取代原来的美股 AI 日报（main.py）。每个美股交易日收盘后推一张短卡：
# 四个市场状态 + 七姐妹强弱 + 今天怎么做 + 关键价位。
# 周末的完整体检仍由 us-market-state.yml 在周六推送。
on:
  schedule:
    # 北京时间周二~周五 07:30 = UTC 周一~周四 23:30，覆盖周一~周四美股
    - cron: '30 23 * * 1-4'
    # 重试班次；当天已推则自动跳过
    - cron: '0 0 * * 2-5'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略“当天已推/数据过旧”，强制运行'
        type: boolean
        default: false
      dry_run:
        description: '只生成不推送（本地式干跑）'
        type: boolean
        default: false
      live:
        description: '正式推送（默认是带【干跑】前缀的观察模式）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: us-daily-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
    defaults:
      run:
        working-directory: research/us_market_state

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 数据源冒烟测试
        run: python smoke_test.py

      - name: 运行状态机测试
        run: |
          pip install pytest
          python -m pytest test_state.py -q

      - name: 生成并推送日报
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python run_daily.py --dry-run
          elif [ "${{ inputs.live }}" = "true" ]; then
            if [ "${{ inputs.force }}" = "true" ]; then
              python run_daily.py --force
            else
              python run_daily.py
            fi
          else
            python run_daily.py --shadow
          fi

      - name: 保存状态（去重 + 状态变化基线）
        if: always()
        run: |
          git config user.name "market-radar-bot"
          git config user.email "market-radar-bot@users.noreply.github.com"
          git add -f cache/last_daily_push.json 2>/dev/null || true
          git add -f cache/last_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: 美股状态日报留痕 [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 失败通知（飞书）
        if: failure()
        run: |
          python - <<'PY' || true
          import os
          import push
          try:
              creds = push.load_credentials()
              url = (f"https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}"
                     f"/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}")
              push.send_text(
                  f"⚠️ 美股状态日报这次没有完整跑完：可能已经发出，也可能没有。\n"
                  f"请对照日志确认：{url}", creds)
          except Exception as exc:
              print("失败通知发送失败:", type(exc).__name__, exc)
          PY

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: us-daily-state-${{ github.run_id }}
          path: research/us_market_state/logs/
          retention-days: 14
          if-no-files-found: ignore
