name: A股周期周报

# 完整周报：本周涨跌 + 五维 + 三个底 + 名词小抄。
# schedule 已停用（2026-11-24）：日卡之外不额外多推一期，避免刷屏。
# 完整版每天仍在 results/panel_YYYY-MM-DD.html 里；需要周报时手动触发本 workflow。
on:
  workflow_dispatch:
    inputs:
      force:
        description: 强制推送（忽略“本周已推送”标记）
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cycle-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
    defaults:
      run:
        working-directory: research/cycle_timing

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 缓存键（同一天内复用，跨天新建）
        id: cachekey
        run: echo "key=cycle-timing-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: 缓存行情数据（复用日卡最新缓存）
        uses: actions/cache@v4
        with:
          path: |
            research/cycle_timing/cache
            research/cycle_timing/signals
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: |
            cycle-timing-

      - name: 以仓库记录为准恢复推送标记
        # 周报标记独立文件，不会被日卡覆盖
        run: |
          git checkout -- cache/last_push.json cache/last_push_weekly.json cache/panel_state.json 2>/dev/null || true

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成周报并推送
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python run_weekly.py --force
          else
            python run_weekly.py
          fi

      - name: 保存周报推送标记
        if: always()
        run: |
          git config user.name "market-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f cache/last_push_weekly.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: 周期周报推送标记 [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 失败通知（飞书）
        if: failure() && hashFiles('research/cycle_timing/push_feishu.py') != ''
        run: |
          python - <<'PY' || true
          import os
          import push_feishu
          try:
              creds = push_feishu.load_credentials()
              url = (f"https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}"
                     f"/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}")
              push_feishu.send_text(
                  f"⚠️ A股周期周报这次没有完整跑完。请对照日志确认。\n{url}", creds)
          except Exception as exc:
              print("失败通知发送失败:", type(exc).__name__, exc)
          PY

      - name: 上传面板和日志（出问题可回查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-weekly-${{ github.run_id }}
          path: |
            research/cycle_timing/results/
            research/cycle_timing/logs/
          retention-days: 7
          if-no-files-found: ignore
